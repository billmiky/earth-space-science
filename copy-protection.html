<style>
  /* Discourage copy/paste of textbook content; form fields stay usable */
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  input, textarea, select, [contenteditable="true"], .allow-copy {
    -webkit-user-select: text; user-select: text;
  }
  img { -webkit-user-drag: none; }
  @media print { body { display: none !important; } }
</style>
<script>
(function () {
  function editable(el) {
    return el && el.closest && el.closest('input, textarea, select, [contenteditable="true"], .allow-copy');
  }
  ['copy', 'cut', 'dragstart', 'contextmenu'].forEach(function (type) {
    document.addEventListener(type, function (e) {
      if (!editable(e.target)) e.preventDefault();
    });
  });
  document.addEventListener('keydown', function (e) {
    if (!(e.ctrlKey || e.metaKey) || editable(e.target)) return;
    var k = e.key.toLowerCase();
    if (k === 'c' || k === 'x' || k === 'a' || k === 'p' || k === 's' || k === 'u') e.preventDefault();
  });
})();
</script>
