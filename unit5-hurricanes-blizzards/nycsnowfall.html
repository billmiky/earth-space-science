<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYC Snowfall Explorer</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        :root {
            --color-bg-primary: #0f172a;
            --color-bg-secondary: #1e293b;
            --color-text-primary: #f1f5f9;
            --color-text-secondary: #cbd5e1;
            --color-accent: #38bdf8;
            --color-accent-hover: #0ea5e9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--color-bg-primary);
            color: var(--color-text-primary);
            padding: 2rem;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--color-accent);
        }

        .subtitle {
            color: var(--color-text-secondary);
            font-size: 1.1rem;
        }

        .controls {
            background: var(--color-bg-secondary);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .control-group {
            margin-bottom: 1.5rem;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--color-text-primary);
        }

        .range-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        input[type="number"] {
            width: 100%;
            padding: 0.75rem;
            background: var(--color-bg-primary);
            border: 2px solid rgba(56, 189, 248, 0.3);
            border-radius: 8px;
            color: var(--color-text-primary);
            font-size: 1rem;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--color-accent);
        }

        .range-slider {
            width: 100%;
            height: 8px;
            background: var(--color-bg-primary);
            border-radius: 4px;
            outline: none;
            -webkit-appearance: none;
        }

        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: var(--color-accent);
            cursor: pointer;
            border-radius: 50%;
        }

        .range-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: var(--color-accent);
            cursor: pointer;
            border-radius: 50%;
            border: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--color-bg-secondary);
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .stat-label {
            color: var(--color-text-secondary);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            color: var(--color-accent);
            font-size: 2rem;
            font-weight: 700;
        }

        .stat-unit {
            color: var(--color-text-secondary);
            font-size: 1rem;
        }

        #chart {
            background: var(--color-bg-secondary);
            border-radius: 12px;
            padding: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            margin-bottom: 2rem;
            min-height: 500px;
        }

        .records {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .records-section {
            background: var(--color-bg-secondary);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .records-section h3 {
            color: var(--color-accent);
            margin-bottom: 1rem;
        }

        .record-item {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            background: var(--color-bg-primary);
            border-radius: 8px;
        }

        .record-season {
            font-weight: 600;
        }

        .record-value {
            color: var(--color-accent);
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            .range-inputs {
                grid-template-columns: 1fr;
            }

            .records {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>NYC Snowfall Explorer</h1>
            <p class="subtitle">Central Park Seasonal Snowfall Data (1869-2026)</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <label>Select Year Range</label>
                <div class="range-inputs">
                    <div>
                        <input type="number" id="startYear" min="1869" max="2025" value="1869">
                    </div>
                    <div>
                        <input type="number" id="endYear" min="1869" max="2025" value="2025">
                    </div>
                </div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Average Snowfall</div>
                <div class="stat-value"><span id="avgSnow">--</span><span class="stat-unit">"</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Maximum Season</div>
                <div class="stat-value"><span id="maxSnow">--</span><span class="stat-unit">"</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Minimum Season</div>
                <div class="stat-value"><span id="minSnow">--</span><span class="stat-unit">"</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Seasons</div>
                <div class="stat-value"><span id="seasonCount">--</span></div>
            </div>
        </div>

        <div id="chart"></div>

        <div class="records">
            <div class="records-section">
                <h3>Top 5 Snowiest Seasons</h3>
                <div id="topSeasons"></div>
            </div>
            <div class="records-section">
                <h3>Top 5 Least Snowy Seasons</h3>
                <div id="bottomSeasons"></div>
            </div>
        </div>
    </div>

        let filteredData = [...snowfallData];

        function filterData() {
            const startYear = parseInt(document.getElementById('startYear').value);
            const endYear = parseInt(document.getElementById('endYear').value);
            
            if (startYear > endYear) {
                document.getElementById('endYear').value = startYear;
                return;
            }

            filteredData = snowfallData.filter(d => d.Year >= startYear && d.Year <= endYear);
            updateChart();
            updateStats();
            updateRecords();
        }

        function updateChart() {
            const trace = {
                x: filteredData.map(d => d.Year),
                y: filteredData.map(d => d.Snowfall),
                type: 'scatter',
                mode: 'lines+markers',
                name: 'Snowfall',
                line: { 
                    color: '#38bdf8',
                    width: 2
                },
                marker: { 
                    color: '#38bdf8',
                    size: 6
                },
                fill: 'tozeroy',
                fillcolor: 'rgba(56, 189, 248, 0.1)',
                hovertemplate: '<b>%{text}</b><br>Snowfall: %{y:.1f}"<extra></extra>',
                text: filteredData.map(d => d.Season)
            };

            const layout = {
                title: {
                    text: 'Seasonal Snowfall at Central Park',
                    font: { size: 20, color: '#f1f5f9' }
                },
                xaxis: {
                    title: 'Year',
                    gridcolor: 'rgba(56, 189, 248, 0.1)',
                    color: '#cbd5e1'
                },
                yaxis: {
                    title: 'Snowfall (inches)',
                    gridcolor: 'rgba(56, 189, 248, 0.1)',
                    color: '#cbd5e1'
                },
                paper_bgcolor: '#1e293b',
                plot_bgcolor: '#1e293b',
                font: { color: '#cbd5e1' },
                hovermode: 'closest',
                showlegend: false,
                margin: { t: 60, r: 40, b: 60, l: 60 }
            };

            const config = {
                responsive: true,
                displayModeBar: true,
                displaylogo: false
            };

            Plotly.react('chart', [trace], layout, config);
        }

        function updateStats() {
            const snowfalls = filteredData.map(d => d.Snowfall);
            const avg = snowfalls.reduce((a, b) => a + b, 0) / snowfalls.length;
            const max = Math.max(...snowfalls);
            const min = Math.min(...snowfalls);

            document.getElementById('avgSnow').textContent = avg.toFixed(1);
            document.getElementById('maxSnow').textContent = max.toFixed(1);
            document.getElementById('minSnow').textContent = min.toFixed(1);
            document.getElementById('seasonCount').textContent = filteredData.length;
        }

        function updateRecords() {
            const sorted = [...filteredData].sort((a, b) => b.Snowfall - a.Snowfall);
            const top5 = sorted.slice(0, 5);
            const bottom5 = sorted.slice(-5).reverse();

            document.getElementById('topSeasons').innerHTML = top5.map(d => `
                <div class="record-item">
                    <span class="record-season">${d.Season}</span>
                    <span class="record-value">${d.Snowfall.toFixed(1)}"</span>
                </div>
            `).join('');

            document.getElementById('bottomSeasons').innerHTML = bottom5.map(d => `
                <div class="record-item">
                    <span class="record-season">${d.Season}</span>
                    <span class="record-value">${d.Snowfall.toFixed(1)}"</span>
                </div>
            `).join('');
        }

        document.getElementById('startYear').addEventListener('input', filterData);
        document.getElementById('endYear').addEventListener('input', filterData);

        filterData();
    </script>
