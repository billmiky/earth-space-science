<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore the Effect of the Angle of Incidence on Sun's Energy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; }
        canvas { 
            display: block; 
            touch-action: none;
        }
        #canvasWrapper {
            width: 800px;
            height: 600px;
            transform: scale(0.72);
            transform-origin: top left;
        }
        #canvasOuter {
            width: calc(800px * 0.72);
            height: calc(600px * 0.72);
            flex-shrink: 0;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-3 flex flex-col">

    <div class="w-full">
        <h1 class="text-lg font-bold text-slate-900 mb-1">Sun Angle &amp; Energy Concentration</h1>
        <p class="text-xs text-slate-500 mb-3">Hover over the sun rays to analyze energy at each latitude. Click to lock a zone.</p>

        <!-- Side-by-side: canvas left, controls right -->
        <div class="flex flex-row gap-3 items-start">

            <!-- Canvas -->
            <div id="canvasOuter" class="relative shadow-xl rounded-xl overflow-hidden border border-slate-300 bg-slate-900 flex-none">
                <div id="canvasWrapper">
                    <canvas id="simCanvas" width="800" height="600"></canvas>
                </div>
            </div>

            <!-- Controls Panel -->
            <div class="flex flex-col gap-3 flex-1 min-w-0">

                <!-- Zone Analysis -->
                <div class="bg-white p-3 rounded-xl shadow-md border border-slate-200">
                    <h3 class="font-bold text-sm text-slate-800 mb-2 border-b border-slate-100 pb-1">Zone Analysis</h3>
                    <div id="zoneInfoText"></div>
                </div>

                <!-- Season -->
                <div class="bg-white p-3 rounded-xl shadow-md border border-slate-200">
                    <h3 class="font-bold text-sm text-slate-800 mb-2 border-b border-slate-100 pb-1">Season</h3>
                    <div class="flex flex-col gap-2">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="season" value="March" class="w-3.5 h-3.5">
                            <span class="text-xs">March (Equinox)</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="season" value="June" checked class="w-3.5 h-3.5">
                            <span class="text-xs">June (Solstice)</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="season" value="September" class="w-3.5 h-3.5">
                            <span class="text-xs">September (Equinox)</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="season" value="December" class="w-3.5 h-3.5">
                            <span class="text-xs">December (Solstice)</span>
                        </label>
                    </div>
                </div>

                <!-- Map -->
                <div class="bg-white p-3 rounded-xl shadow-md border border-slate-200">
                    <h3 class="font-bold text-sm text-slate-800 mb-2 border-b border-slate-100 pb-1">Map Region</h3>
                    <select id="mapSelect" class="w-full p-2 text-xs bg-slate-50 border border-slate-300 rounded-lg cursor-pointer">
                        <option value="Americas">Americas</option>
                        <option value="EuropeAfrica">Europe / Africa</option>
                        <option value="AsiaAustralia">Asia / Australia</option>
                    </select>
                </div>

                <p class="text-xs text-slate-400">Inspired by Tom Whittaker's Weather Wise (2011).</p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        let tiltAngle = -23.5;
        let currentMap = 'Americas';
        let hoveredZone = -1;
        let lockedZone = -1;

        const EARTH_X = 450;
        const EARTH_Y = 300;
        const EARTH_R = 220;
        const NUM_ZONES = 10;
        const ZONE_HEIGHT = (EARTH_R * 2) / NUM_ZONES;
        const RAYS_START_X = 50;
        
        const mapData = {
            Americas: [
                [[70, -160], [70, -60], [55, -55], [45, -60], [30, -80], [15, -90], [10, -85], [10, -75], [15, -80], [25, -90], [50, -125], [60, -140], [70, -160]],
                [[10, -75], [-5, -35], [-20, -40], [-55, -65], [-55, -75], [-20, -75], [0, -80], [10, -75]],
                [[80, -20], [80, -60], [60, -45], [60, -30], [80, -20]]
            ],
            EuropeAfrica: [
                [[70, 10], [70, 40], [45, 40], [45, 10], [35, -10], [50, -10], [60, 0], [70, 10]],
                [[35, -10], [35, 30], [15, 50], [-10, 40], [-35, 20], [-35, 15], [0, 10], [15, -15], [35, -10]],
                [[60, -5], [50, -5], [50, 0], [60, 0], [60, -5]],
                [[-15, 45], [-25, 45], [-25, 50], [-15, 50], [-15, 45]]
            ],
            AsiaAustralia: [
                [[70, 40], [70, 170], [60, 170], [40, 140], [20, 110], [10, 105], [5, 100], [15, 90], [10, 75], [25, 65], [45, 40], [70, 40]],
                [[-10, 115], [-10, 145], [-35, 150], [-35, 115], [-10, 115]],
                [[45, 140], [30, 130], [35, 140], [45, 145], [45, 140]],
                [[0, 100], [5, 115], [-10, 140], [-5, 150], [0, 140], [0, 100]]
            ]
        };
        const mapCenters = { Americas: -90, EuropeAfrica: 20, AsiaAustralia: 120 };

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.shadowBlur = 40;
            ctx.shadowColor = '#f59e0b';
            ctx.beginPath(); 
            ctx.arc(-60, EARTH_Y, 110, 0, 2*Math.PI);
            ctx.fillStyle = '#fbbf24'; 
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.save();
            ctx.beginPath();
            ctx.arc(EARTH_X, EARTH_Y, EARTH_R, 0, 2 * Math.PI);
            ctx.fillStyle = '#0284c7';
            ctx.fill();
            ctx.clip();

            let polys = mapData[currentMap];
            let cLon = mapCenters[currentMap] * Math.PI / 180;
            let tiltRad = tiltAngle * Math.PI / 180;

            ctx.fillStyle = '#22c55e';
            ctx.strokeStyle = '#14532d';
            ctx.lineWidth = 1.5;

            for (let poly of polys) {
                let avgZ = poly.reduce((sum, pt) => sum + Math.cos(pt[0]*Math.PI/180)*Math.cos(pt[1]*Math.PI/180 - cLon), 0) / poly.length;
                if (avgZ > -0.2) {
                    ctx.beginPath();
                    let first = true;
                    for (let pt of poly) {
                        let lat = pt[0] * Math.PI/180;
                        let lon = pt[1] * Math.PI/180;
                        let dLon = lon - cLon;
                        let X0 = Math.cos(lat) * Math.sin(dLon);
                        let Y0 = Math.sin(lat);
                        let X1 = X0 * Math.cos(tiltRad) + Y0 * Math.sin(tiltRad);
                        let Y1 = -X0 * Math.sin(tiltRad) + Y0 * Math.cos(tiltRad);
                        let cx = EARTH_X + EARTH_R * X1;
                        let cy = EARTH_Y - EARTH_R * Y1;
                        if (first) { ctx.moveTo(cx, cy); first = false; }
                        else { ctx.lineTo(cx, cy); }
                    }
                    ctx.fill();
                    ctx.stroke();
                }
            }

            ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
            ctx.fillRect(EARTH_X, EARTH_Y - EARTH_R, EARTH_R, EARTH_R * 2);

            const latitudes = [
                { val: 0, name: 'Equator' },
                { val: 23.5, name: 'Tropic of Cancer' },
                { val: -23.5, name: 'Tropic of Capricorn' },
                { val: 66.5, name: 'Arctic Circle' },
                { val: -66.5, name: 'Antarctic Circle' }
            ];

            let labelsToDraw = [];

            for (let l of latitudes) {
                let latRad = l.val * Math.PI / 180;
                let X0_left = -Math.cos(latRad), Y0_left = Math.sin(latRad);
                let X1_left = X0_left * Math.cos(tiltRad) + Y0_left * Math.sin(tiltRad);
                let Y1_left = -X0_left * Math.sin(tiltRad) + Y0_left * Math.cos(tiltRad);
                let X0_right = Math.cos(latRad), Y0_right = Math.sin(latRad);
                let X1_right = X0_right * Math.cos(tiltRad) + Y0_right * Math.sin(tiltRad);
                let Y1_right = -X0_right * Math.sin(tiltRad) + Y0_right * Math.cos(tiltRad);
                let cx_left = EARTH_X + EARTH_R * X1_left;
                let cy_left = EARTH_Y - EARTH_R * Y1_left;
                let cx_right = EARTH_X + EARTH_R * X1_right;
                let cy_right = EARTH_Y - EARTH_R * Y1_right;
                ctx.beginPath();
                ctx.moveTo(cx_left, cy_left);
                ctx.lineTo(cx_right, cy_right);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                ctx.setLineDash([]);
                labelsToDraw.push({ text: l.name, x: cx_right + 15, y: cy_right });
            }

            ctx.restore();

            ctx.beginPath();
            ctx.arc(EARTH_X, EARTH_Y, EARTH_R, 0, 2 * Math.PI);
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#cbd5e1';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            for (let label of labelsToDraw) {
                ctx.fillText(label.text, label.x, label.y);
            }

            let npX = EARTH_X + EARTH_R * Math.sin(tiltRad);
            let npY = EARTH_Y - EARTH_R * Math.cos(tiltRad);
            let spX = EARTH_X - EARTH_R * Math.sin(tiltRad);
            let spY = EARTH_Y + EARTH_R * Math.cos(tiltRad);
            ctx.fillStyle = '#ef4444';
            ctx.beginPath(); ctx.arc(npX, npY, 5, 0, 2*Math.PI); ctx.fill();
            ctx.fillStyle = '#0ea5e9';
            ctx.beginPath(); ctx.arc(spX, spY, 5, 0, 2*Math.PI); ctx.fill();

            const topY = EARTH_Y - EARTH_R;
            
            for (let i = 0; i < NUM_ZONES; i++) {
                let y1 = topY + i * ZONE_HEIGHT;
                let y2 = topY + (i + 1) * ZONE_HEIGHT;
                let isActive = (hoveredZone === i) || (lockedZone === i);

                let dy1 = y1 - EARTH_Y;
                let dy2 = y2 - EARTH_Y;
                let hitX1 = EARTH_X - Math.sqrt(Math.max(0, EARTH_R * EARTH_R - dy1 * dy1));
                let hitX2 = EARTH_X - Math.sqrt(Math.max(0, EARTH_R * EARTH_R - dy2 * dy2));
                let startAngle = Math.atan2(dy1, hitX1 - EARTH_X);
                let endAngle = Math.atan2(dy2, hitX2 - EARTH_X);

                ctx.beginPath();
                ctx.moveTo(RAYS_START_X, y1);
                ctx.lineTo(hitX1, y1);
                ctx.arc(EARTH_X, EARTH_Y, EARTH_R, startAngle, endAngle, true);
                ctx.lineTo(RAYS_START_X, y2);
                ctx.closePath();

                if (isActive) {
                    ctx.fillStyle = 'rgba(253, 224, 71, 0.4)'; 
                    ctx.fill();
                    ctx.strokeStyle = '#fef08a';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(EARTH_X, EARTH_Y, EARTH_R, startAngle, endAngle, true);
                    ctx.strokeStyle = '#ef4444';
                    ctx.lineWidth = 5;
                    ctx.stroke();
                } else {
                    ctx.fillStyle = 'rgba(253, 224, 71, 0.05)';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(253, 224, 71, 0.15)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }

            updateInfoPanel();
        }

        function updateInfoPanel() {
            const panel = document.getElementById('zoneInfoText');
            let activeZone = hoveredZone !== -1 ? hoveredZone : lockedZone;

            if (activeZone !== -1) {
                let y1 = (EARTH_Y - EARTH_R) + activeZone * ZONE_HEIGHT;
                let y2 = (EARTH_Y - EARTH_R) + (activeZone + 1) * ZONE_HEIGHT;
                let dy1 = y1 - EARTH_Y;
                let dy2 = y2 - EARTH_Y;

                let startAngle = Math.atan2(dy1, -Math.sqrt(Math.max(0, EARTH_R*EARTH_R - dy1*dy1)));
                let endAngle = Math.atan2(dy2, -Math.sqrt(Math.max(0, EARTH_R*EARTH_R - dy2*dy2)));

                let dTheta = startAngle - endAngle;
                if (dTheta < 0) dTheta += 2 * Math.PI;

                let surfaceWidth = EARTH_R * dTheta;
                let rayWidth = ZONE_HEIGHT;
                let concentration = (rayWidth / surfaceWidth) * 100;

                let textDesc = "";
                if (concentration >= 95) textDesc = "Peak Concentration. Light directly hits the surface without spreading much.";
                else if (concentration >= 70) textDesc = "Moderate Concentration. Light starts to spread over a slightly larger area.";
                else if (concentration >= 40) textDesc = "Low Concentration. Energy is significantly diluted over a large arc.";
                else textDesc = "Glancing Rays. Very little energy is absorbed over a massive surface area.";

                panel.innerHTML = `
                    <div class="flex flex-col gap-2">
                        <div class="flex justify-between items-center text-slate-700 text-xs">
                            <span>Ray Width:</span>
                            <span class="font-bold bg-slate-100 px-1.5 py-0.5 rounded">${rayWidth.toFixed(1)} u</span>
                        </div>
                        <div class="flex justify-between items-center text-slate-700 text-xs">
                            <span>Surface Arc:</span>
                            <span class="font-bold bg-slate-100 px-1.5 py-0.5 rounded">${surfaceWidth.toFixed(1)} u</span>
                        </div>
                        <div class="pt-2 border-t border-slate-200">
                            <div class="text-xs text-slate-400 uppercase tracking-wider font-bold mb-1">Energy Intensity</div>
                            <div class="text-3xl font-black ${concentration >= 80 ? 'text-red-500' : concentration >= 50 ? 'text-orange-500' : 'text-blue-500'}">
                                ${concentration.toFixed(0)}%
                            </div>
                            <div class="text-xs leading-tight text-slate-600 mt-1">${textDesc}</div>
                        </div>
                        ${lockedZone === activeZone ? 
                            '<div class="text-xs text-green-600 font-semibold mt-1">✓ Locked. Click to unlock.</div>' : 
                            '<div class="text-xs text-blue-500 italic mt-1">Click to lock.</div>'
                        }
                    </div>
                `;
            } else {
                panel.innerHTML = `
                    <div class="text-slate-500 italic text-xs leading-relaxed">
                        Hover over a ray to see data.
                    </div>
                `;
            }
        }

        document.querySelectorAll('input[name="season"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                let s = e.target.value;
                if (s === 'March' || s === 'September') tiltAngle = 0;
                else if (s === 'June') tiltAngle = -23.5;
                else if (s === 'December') tiltAngle = 23.5;
                draw();
            });
        });

        document.getElementById('mapSelect').addEventListener('change', (e) => {
            currentMap = e.target.value;
            draw();
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;

            let found = -1;
            const topY = EARTH_Y - EARTH_R;
            const bottomY = EARTH_Y + EARTH_R;

            if (y >= topY && y <= bottomY) {
                let i = Math.floor((y - topY) / ZONE_HEIGHT);
                let hitX = EARTH_X - Math.sqrt(Math.max(0, EARTH_R * EARTH_R - (y - EARTH_Y) * (y - EARTH_Y)));
                if (x >= RAYS_START_X && x <= hitX) {
                    found = i;
                }
            }

            if (found !== hoveredZone) {
                hoveredZone = found;
                draw();
            }
        });

        canvas.addEventListener('mouseleave', () => {
            hoveredZone = -1;
            draw();
        });

        canvas.addEventListener('click', () => {
            if (hoveredZone !== -1) {
                lockedZone = hoveredZone;
            } else {
                lockedZone = -1;
            }
            draw();
        });

        draw();
    </script>
</body>
</html>
