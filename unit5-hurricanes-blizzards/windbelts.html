<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wind Belts Simulation</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      width: 100%;
      height: auto;
    }
    #player-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 0;
    }
    #player-frame {
      width: 100%;
      max-width: 760px;
      aspect-ratio: 750 / 530;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
    }
    #player-frame object,
    #player-frame embed {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div id="player-wrap">
    <div id="player-frame">
      <object data="windbelts.swf" type="application/x-shockwave-flash">
        <param name="movie" value="windbelts.swf" />
        <param name="quality" value="high" />
        <param name="bgcolor" value="#ffffff" />
        <param name="scale" value="exactfit" />
        <param name="salign" value="lt" />
        <param name="play" value="true" />
        <param name="loop" value="true" />
        <embed src="windbelts.swf" type="application/x-shockwave-flash" quality="high" bgcolor="#ffffff" scale="exactfit" salign="lt" play="true" loop="true" />
      </object>
    </div>
  </div>

  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on",
      unmuteOverlay: "hidden"
    };
  </script>
  <script src="ruffle/ruffle.js"></script>
</body>
</html>
