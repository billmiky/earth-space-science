{% extends "base.html" %}{% block title %}Set up{% endblock %}
{% block content %}
<div class="card" style="max-width:520px;margin:40px auto">
  <h1>Welcome — set a password</h1>
  <p class="muted">This app will hold student scores, so it's always behind a password. There's one account: you.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <div class="row"><label>Password (10+ characters)<input type="password" name="password" autocomplete="new-password" required></label></div>
    <div class="row"><label>Type it again<input type="password" name="password2" autocomplete="new-password" required></label></div>
    <button>Save password</button>
  </form>
</div>
{% endblock %}
