<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}ESS Tracker{% endblock %} · ESS Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% if session.get('auth') %}
<header class="topbar no-print">
  <a class="brand" href="{{ url_for('main.dashboard') }}">🌎 ESS Tracker</a>
  <nav>
    <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
    <a href="{{ url_for('main.assessments') }}">Assessments</a>
    <a href="{{ url_for('main.standards_grid') }}">Standards</a>
    <a href="{{ url_for('main.skills_grid') }}">Skills</a>
    <a href="{{ url_for('main.students') }}">Students</a>
    <a href="{{ url_for('main.items') }}">Item bank</a>
    <a href="{{ url_for('main.settings') }}">Settings</a>
    <form method="post" action="{{ url_for('main.logout') }}" class="inline">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <button class="link">Log out</button>
    </form>
  </nav>
</header>
{% endif %}
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
