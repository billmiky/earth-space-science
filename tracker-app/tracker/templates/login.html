{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto">
  <h1>🌎 ESS Tracker</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <div class="row"><label>Password<input type="password" name="password" autocomplete="current-password" autofocus required></label></div>
    <button>Log in</button>
  </form>
</div>
{% endblock %}
