{% extends "base.html" %}{% block title %}Settings{% endblock %}
{% block content %}
<h1>Settings</h1>
<div class="card">
  <h2>Change password</h2>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <div class="row">
      <label>Current<input type="password" name="current" autocomplete="current-password" required></label>
      <label>New (10+ characters)<input type="password" name="new" autocomplete="new-password" required></label>
      <button>Change</button>
    </div>
  </form>
</div>
<div class="card">
  <h2>Export &amp; backup</h2>
  <div class="actions">
    <a class="btn secondary" href="{{ url_for('main.backup') }}">Download full backup (.db)</a>
    <a class="btn secondary" href="{{ url_for('main.export_standards') }}">Standards mastery (.csv)</a>
    <a class="btn secondary" href="{{ url_for('main.export_responses') }}">Every answer (.csv)</a>
  </div>
  <p class="muted">Backups contain student data. Keep them somewhere private.</p>
</div>
{% endblock %}
