services:
  ess-tracker:
    build: .
    container_name: ess-tracker
    restart: unless-stopped
    ports:
      # Bound to localhost by default. Change to "8000:8000" to reach it from
      # other devices on your home network (or put it behind Tailscale).
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
