<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DFD4C2"/>
      <stop offset="56%" stop-color="#E2BC8E"/>
      <stop offset="100%" stop-color="#C97C4E"/>
    </linearGradient>
    <filter id="paper" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="a">
        <feFuncA type="linear" slope="0.045"/>
      </feComponentTransfer>
      <feBlend mode="multiply" in2="SourceGraphic"/>
    </filter>
    
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  
    <!-- Sweeping Art Deco Volcanic Plume Rays from Krakatoa on Left -->
    <g fill="#A94A2B" opacity="0.14"><polygon points="179.5,335.1 -463.0,212.6 -437.2,116.4 180.4,331.4"/><polygon points="181.6,328.7 -407.2,44.0 -357.4,-42.2 183.5,325.4"/><polygon points="185.3,323.0 -309.8,-104.3 -239.3,-174.8 188.0,320.3"/><polygon points="190.4,318.5 -177.2,-222.4 -91.0,-272.2 193.7,316.6"/><polygon points="196.4,315.4 -18.6,-302.2 77.6,-328.0 200.1,314.5"/><polygon points="203.1,314.1 155.2,-338.2 254.8,-338.2 206.9,314.1"/><polygon points="209.9,314.5 332.4,-328.0 428.6,-302.2 213.6,315.4"/><polygon points="216.3,316.6 501.0,-272.2 587.2,-222.4 219.6,318.5"/><polygon points="222.0,320.3 649.3,-174.8 719.8,-104.3 224.7,323.0"/><polygon points="226.5,325.4 767.4,-42.2 817.2,44.0 228.4,328.7"/><polygon points="229.6,331.4 847.2,116.4 873.0,212.6 230.5,335.1"/></g>
    <!-- Sweeping Sculpted Ash Plume Drifting Rightward -->
    <g fill="#5C534E" opacity="0.38">
      <circle cx="205" cy="245" r="76"/><circle cx="135" cy="220" r="54"/><circle cx="285" cy="205" r="64"/>
      <circle cx="375" cy="185" r="48"/><circle cx="450" cy="175" r="34"/>
    </g>
    <!-- Far Sea Horizon -->
    <rect x="0" y="655" width="1600" height="120" fill="#1F5B70"/>
    <g fill="#5B9AA8" opacity="0.45">
      <rect x="290" y="684" width="1020" height="7" rx="3.5"/>
      <rect x="420" y="712" width="760" height="6" rx="3"/>
    </g>
    <!-- Dominant Left Krakatoa Volcanic Cone -->
    <polygon points="-50,700 180,340 232,340 465,700" fill="#2D3942"/>
    <polygon points="205,340 232,340 465,700 265,700" fill="#465863"/>
    <polygon points="196,340 216,340 238,765 178,765" fill="#D8652F" opacity="0.86"/>
    <!-- Asymmetric Right Basalt Caldera Cliff & Rising New Island Cone (Anak Krakatau) -->
    <polygon points="1165,700 1310,515 1355,515 1470,700" fill="#32404A"/>
    <polygon points="1335,515 1355,515 1470,700 1365,700" fill="#4C5F6B"/>
    <polygon points="1328,515 1342,515 1352,765 1318,765" fill="#D8652F" opacity="0.72"/>
    <polygon points="1390,700 1495,435 1610,490 1610,705" fill="#253038"/>
    <polygon points="1495,435 1535,560 1440,620" fill="#B56038" opacity="0.52"/>
    <!-- Cutaway Concentric Crust / Mantle / Outer Core / Inner Core Arcs -->
    <path d="M0,745 Q800,715 1600,745 L1600,1000 L0,1000 Z" fill="#59352A"/>
    <path d="M0,805 Q800,750 1600,805 L1600,1000 L0,1000 Z" fill="#A63F24"/>
    <path d="M0,875 Q800,800 1600,875 L1600,1000 L0,1000 Z" fill="#D67C2B"/>
    <path d="M260,1000 Q800,855 1340,1000 Z" fill="#F0B94D"/>
    
  <!-- Subtle Art Deco poster inner framing lines -->
  <g fill="none" stroke="#3E2A22" stroke-opacity="0.16" stroke-width="2">
    <rect x="26" y="26" width="1548" height="948" rx="4"/>
    <rect x="36" y="36" width="1528" height="928" rx="2" stroke-opacity="0.09" stroke-width="1"/>
  </g>
  <!-- Subtle matte poster paper texture -->
  <rect width="1600" height="1000" fill="#ffffff" opacity="0.001" filter="url(#paper)"/>
</svg>
