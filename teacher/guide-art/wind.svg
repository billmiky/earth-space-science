<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBE0E6"/>
      <stop offset="56%" stop-color="#E8E7DB"/>
      <stop offset="100%" stop-color="#DFC496"/>
    </linearGradient>
    <filter id="paper" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="a">
        <feFuncA type="linear" slope="0.045"/>
      </feComponentTransfer>
      <feBlend mode="multiply" in2="SourceGraphic"/>
    </filter>
    
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  
    <!-- Bold Sweeping Art Deco Gale Ribbons -->
    <g fill="none" stroke-linecap="round">
      <path d="M-40,210 C320,120 620,295 1040,185 C1280,125 1460,175 1640,135" stroke="#1B5E78" stroke-width="11" opacity="0.22"/>
      <path d="M-40,252 C320,162 620,337 1040,227 C1280,167 1460,217 1640,177" stroke="#2D748D" stroke-width="6" opacity="0.20"/>
      <path d="M-40,288 C320,198 620,373 1040,263 C1280,203 1460,253 1640,213" stroke="#C99036" stroke-width="4" opacity="0.28"/>
      <path d="M-40,425 C260,355 540,485 860,415 C1180,345 1420,415 1640,365" stroke="#1B5E78" stroke-width="8" opacity="0.18"/>
      <path d="M-40,462 C260,392 540,522 860,452 C1180,382 1420,452 1640,402" stroke="#C99036" stroke-width="3.5" opacity="0.24"/>
    </g>
    <!-- Cyclonic Isobar Rings on Left & Right -->
    <g fill="none" stroke="#1B5E78" stroke-dasharray="12 8" opacity="0.30">
      <ellipse cx="215" cy="235" rx="140" ry="74" transform="rotate(-12 215 235)" stroke-width="3"/>
      <ellipse cx="215" cy="235" rx="84" ry="44" transform="rotate(-12 215 235)" stroke-width="2.2"/>
      <ellipse cx="1390" cy="215" rx="128" ry="68" transform="rotate(10 1390 215)" stroke-width="3"/>
    </g>
    <!-- Rolling Coastal Bluffs -->
    <path d="M0,715 Q260,595 560,725 T1200,720 Q1420,615 1600,690 L1600,1000 L0,1000 Z" fill="#4C7785"/>
    <path d="M0,785 Q310,685 620,810 T1240,800 Q1440,705 1600,775 L1600,1000 L0,1000 Z" fill="#325A52"/>
    <polygon points="142.8,505.0 147.2,505.0 150.5,745.0 139.5,745.0" fill="#173F50"/><polygon points="145.0,505.0 166.7,509.6 240.9,536.1 165.3,514.0" fill="#173F50"/><polygon points="145.0,505.0 130.2,521.5 70.1,572.4 127.1,518.0" fill="#173F50"/><polygon points="145.0,505.0 138.1,483.9 124.0,406.4 142.7,482.9" fill="#173F50"/><circle cx="145.0" cy="505.0" r="4.5" fill="#173F50"/>
    <polygon points="272.8,590.0 277.2,590.0 280.5,770.0 269.5,770.0" fill="#245466"/><polygon points="275.0,590.0 287.4,601.1 325.6,646.2 284.8,603.5" fill="#245466"/><polygon points="275.0,590.0 259.2,595.1 201.1,605.7 258.5,591.7" fill="#245466"/><polygon points="275.0,590.0 278.5,573.7 298.4,518.1 281.8,574.8" fill="#245466"/><circle cx="275.0" cy="590.0" r="4.5" fill="#245466"/>
    <polygon points="1452.8,495.0 1457.2,495.0 1460.5,740.0 1449.5,740.0" fill="#173F50"/><polygon points="1455.0,495.0 1475.3,504.9 1542.3,549.5 1472.8,508.9" fill="#173F50"/><polygon points="1455.0,495.0 1436.2,507.7 1364.1,543.3 1434.0,503.5" fill="#173F50"/><polygon points="1455.0,495.0 1453.4,472.4 1458.6,392.2 1458.2,472.6" fill="#173F50"/><circle cx="1455.0" cy="495.0" r="4.5" fill="#173F50"/>
    <polygon points="1322.8,580.0 1327.2,580.0 1330.5,765.0 1319.5,765.0" fill="#245466"/><polygon points="1325.0,580.0 1333.8,594.7 1357.8,650.4 1330.6,596.2" fill="#245466"/><polygon points="1325.0,580.0 1307.9,580.3 1247.6,573.2 1308.2,576.7" fill="#245466"/><polygon points="1325.0,580.0 1333.3,565.0 1369.6,516.4 1336.2,567.1" fill="#245466"/><circle cx="1325.0" cy="580.0" r="4.5" fill="#245466"/>
    <path d="M0,885 Q420,835 820,895 T1600,875 L1600,1000 L0,1000 Z" fill="#183E4F"/>
    
  <!-- Subtle Art Deco poster inner framing lines -->
  <g fill="none" stroke="#1B5E78" stroke-opacity="0.16" stroke-width="2">
    <rect x="26" y="26" width="1548" height="948" rx="4"/>
    <rect x="36" y="36" width="1528" height="928" rx="2" stroke-opacity="0.09" stroke-width="1"/>
  </g>
  <!-- Subtle matte poster paper texture -->
  <rect width="1600" height="1000" fill="#ffffff" opacity="0.001" filter="url(#paper)"/>
</svg>
