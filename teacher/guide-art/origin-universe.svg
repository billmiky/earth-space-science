<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#19253F"/>
      <stop offset="56%" stop-color="#303A60"/>
      <stop offset="100%" stop-color="#7D4952"/>
    </linearGradient>
    <filter id="paper" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="a">
        <feFuncA type="linear" slope="0.045"/>
      </feComponentTransfer>
      <feBlend mode="multiply" in2="SourceGraphic"/>
    </filter>
    
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  
    <!-- Expanding Art Deco Big Bang Sunburst -->
    <g fill="#E0A84E" opacity="0.14"><polygon points="859.7,434.1 2073.9,315.1 2073.9,564.9 859.7,445.9"/><polygon points="858.1,454.9 2039.8,758.3 1954.3,993.1 854.1,465.9"/><polygon points="849.5,473.9 1856.1,1163.2 1695.6,1354.5 842.0,482.9"/><polygon points="834.9,488.8 1545.1,1480.8 1328.8,1605.7 824.8,494.6"/><polygon points="816.1,497.8 1144.2,1672.8 898.2,1716.2 804.6,499.8"/><polygon points="795.4,499.8 701.8,1716.2 455.8,1672.8 783.9,497.8"/><polygon points="775.2,494.6 271.2,1605.7 54.9,1480.8 765.1,488.8"/><polygon points="758.0,482.9 -95.6,1354.5 -256.1,1163.2 750.5,473.9"/><polygon points="745.9,465.9 -354.3,993.1 -439.8,758.3 741.9,454.9"/><polygon points="740.3,445.9 -473.9,564.9 -473.9,315.1 740.3,434.1"/><polygon points="741.9,425.1 -439.8,121.7 -354.3,-113.1 745.9,414.1"/><polygon points="750.5,406.1 -256.1,-283.2 -95.6,-474.5 758.0,397.1"/><polygon points="765.1,391.2 54.9,-600.8 271.2,-725.7 775.2,385.4"/><polygon points="783.9,382.2 455.8,-792.8 701.8,-836.2 795.4,380.2"/><polygon points="804.6,380.2 898.2,-836.2 1144.2,-792.8 816.1,382.2"/><polygon points="824.8,385.4 1328.8,-725.7 1545.1,-600.8 834.9,391.2"/><polygon points="842.0,397.1 1695.6,-474.5 1856.1,-283.2 849.5,406.1"/><polygon points="854.1,414.1 1954.3,-113.1 2039.8,121.7 858.1,425.1"/><polygon points="859.7,434.1 2073.9,315.1 2073.9,564.9 859.7,445.9"/></g>
    <!-- Concentric Redshift Wave Arcs -->
    <g fill="none">
      <circle cx="800" cy="440" r="210" stroke="#76A9D4" stroke-width="2.5" opacity="0.32"/>
      <circle cx="800" cy="440" r="350" stroke="#A699C4" stroke-width="2.5" opacity="0.28"/>
      <circle cx="800" cy="440" r="510" stroke="#D17B5C" stroke-width="3" opacity="0.28"/>
      <circle cx="800" cy="440" r="685" stroke="#C85A3F" stroke-width="3.5" opacity="0.25"/>
      <circle cx="800" cy="440" r="850" stroke="#B64935" stroke-width="3" opacity="0.22"/>
    </g>
    <!-- Stylized Spiral Galaxy — Left Wing -->
    <g transform="translate(205 290) rotate(-28)" opacity="0.82">
      <ellipse cx="0" cy="0" rx="135" ry="44" fill="none" stroke="#E8BA67" stroke-width="5" opacity="0.55"/>
      <ellipse cx="0" cy="0" rx="92" ry="28" fill="none" stroke="#F3DFB5" stroke-width="4" opacity="0.72"/>
      <ellipse cx="0" cy="0" rx="46" ry="15" fill="#F6E9CE" opacity="0.88"/>
    </g>
    <!-- Stylized Spiral Galaxy — Right Wing -->
    <g transform="translate(1395 250) rotate(24)" opacity="0.82">
      <ellipse cx="0" cy="0" rx="125" ry="38" fill="none" stroke="#D97B59" stroke-width="5" opacity="0.62"/>
      <ellipse cx="0" cy="0" rx="82" ry="24" fill="none" stroke="#F2D7A8" stroke-width="3.5" opacity="0.75"/>
      <ellipse cx="0" cy="0" rx="40" ry="13" fill="#FFF1D4" opacity="0.88"/>
    </g>
    <!-- Starfield -->
    <g fill="#F8EED8" opacity="0.75">
      <circle cx="115" cy="120" r="3"/><circle cx="340" cy="140" r="2.2"/><circle cx="290" cy="445" r="2.4"/>
      <circle cx="1275" cy="120" r="2.5"/><circle cx="1490" cy="390" r="2.8"/><circle cx="1320" cy="480" r="2"/>
      <circle cx="120" cy="520" r="2.5"/><circle cx="1470" cy="110" r="2.4"/>
    </g>
    <!-- Art Deco Horizon Silhouette & Twin Deep-Sky Dishes -->
    <polygon points="0,785 210,670 395,745 800,820 1210,740 1405,665 1600,780 1600,1000 0,1000" fill="#222A44"/>
    <path d="M0,855 Q400,805 800,865 T1600,845 L1600,1000 L0,1000 Z" fill="#151B2E"/>
    <g transform="translate(180 735)" fill="#E0B872" opacity="0.85">
      <path d="M-42,-42 Q0,-2 42,-42 L28,-54 Q0,-26 -28,-54 Z"/>
      <rect x="-5" y="-22" width="10" height="44"/>
      <polygon points="-24,22 24,22 14,50 -14,50"/>
    </g>
    <g transform="translate(1425 730)" fill="#E0B872" opacity="0.85">
      <path d="M-38,-40 Q0,-4 38,-40 L25,-51 Q0,-25 -25,-51 Z"/>
      <rect x="-5" y="-20" width="10" height="42"/>
      <polygon points="-22,22 22,22 12,48 -12,48"/>
    </g>
    
  <!-- Subtle Art Deco poster inner framing lines -->
  <g fill="none" stroke="#F1EAE0" stroke-opacity="0.16" stroke-width="2">
    <rect x="26" y="26" width="1548" height="948" rx="4"/>
    <rect x="36" y="36" width="1528" height="928" rx="2" stroke-opacity="0.09" stroke-width="1"/>
  </g>
  <!-- Subtle matte poster paper texture -->
  <rect width="1600" height="1000" fill="#ffffff" opacity="0.001" filter="url(#paper)"/>
</svg>
