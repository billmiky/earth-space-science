<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18324C"/>
      <stop offset="56%" stop-color="#2B5270"/>
      <stop offset="100%" stop-color="#C8935A"/>
    </linearGradient>
    <filter id="paper" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="a">
        <feFuncA type="linear" slope="0.045"/>
      </feComponentTransfer>
      <feBlend mode="multiply" in2="SourceGraphic"/>
    </filter>
    
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  
    <!-- Art Deco cosmic sunbeams rising from low horizon -->
    <g fill="#F2E7CE" opacity="0.09"><polygon points="680.5,729.3 -445.0,628.2 -427.6,504.3 682.2,717.4"/><polygon points="684.3,708.2 -405.2,408.5 -366.0,289.6 688.1,696.8"/><polygon points="691.8,688.1 -327.0,199.3 -267.3,89.3 697.5,677.5"/><polygon points="702.8,669.7 -212.8,7.4 -134.5,-90.2 710.3,660.3"/><polygon points="716.8,653.5 -66.3,-161.1 28.2,-243.3 725.9,645.6"/><polygon points="733.6,640.1 107.9,-300.9 215.5,-364.9 743.9,633.9"/><polygon points="752.4,629.8 304.2,-407.5 421.4,-451.3 763.7,625.6"/><polygon points="772.8,623.1 516.3,-477.4 639.4,-499.6 784.6,621.0"/><polygon points="794.0,620.2 737.4,-508.4 862.6,-508.4 806.0,620.2"/><polygon points="815.4,621.0 960.6,-499.6 1083.7,-477.4 827.2,623.1"/><polygon points="836.3,625.6 1178.6,-451.3 1295.8,-407.5 847.6,629.8"/><polygon points="856.1,633.9 1384.5,-364.9 1492.1,-300.9 866.4,640.1"/><polygon points="874.1,645.6 1571.8,-243.3 1666.3,-161.1 883.2,653.5"/><polygon points="889.7,660.3 1734.5,-90.2 1812.8,7.4 897.2,669.7"/><polygon points="902.5,677.5 1867.3,89.3 1927.0,199.3 908.2,688.1"/><polygon points="911.9,696.8 1966.0,289.6 2005.2,408.5 915.7,708.2"/><polygon points="917.8,717.4 2027.6,504.3 2045.0,628.2 919.5,729.3"/></g>
    <g fill="none" stroke="#E5B966" stroke-opacity="0.30">
      <ellipse cx="800" cy="430" rx="680" ry="205" transform="rotate(-11 800 430)" stroke-width="2.5"/>
      <ellipse cx="800" cy="430" rx="540" ry="155" transform="rotate(-11 800 430)" stroke-width="1.5" stroke-dasharray="10 8"/>
      <ellipse cx="800" cy="430" rx="810" ry="255" transform="rotate(-11 800 430)" stroke-width="1.5" stroke-opacity="0.18"/>
    </g>
    <!-- Stars -->
    <g fill="#F6ECD5" opacity="0.76">
      <circle cx="140" cy="130" r="3"/><circle cx="260" cy="95" r="2.2"/><circle cx="345" cy="195" r="2.5"/>
      <circle cx="1220" cy="110" r="2.8"/><circle cx="1370" cy="175" r="2.2"/><circle cx="1480" cy="115" r="3.2"/>
      <circle cx="95" cy="285" r="2"/><circle cx="1495" cy="290" r="2.4"/><circle cx="480" cy="88" r="2"/>
    </g>
    <!-- Ringed Exoplanet on Left Wing -->
    <g transform="translate(215 245) rotate(-18)">
      <ellipse cx="0" cy="0" rx="115" ry="24" fill="none" stroke="#E8BA67" stroke-width="6" opacity="0.75"/>
      <circle cx="0" cy="0" r="54" fill="#C9603B"/>
      <path d="M-54,0 A54,54 0 0,1 54,0 Z" fill="#E3974A" opacity="0.65"/>
      <path d="M-115,0 A115,24 0 0,0 115,0" fill="none" stroke="#F4DFB0" stroke-width="5" opacity="0.88"/>
    </g>
    <!-- Comet Borrelly on Right Wing -->
    <g opacity="0.90">
      <polygon points="1355,215 1575,95 1595,148 1360,224" fill="#E8BA67" opacity="0.34"/>
      <polygon points="1355,215 1560,122 1572,144 1358,221" fill="#F6E9C9" opacity="0.64"/>
      <circle cx="1354" cy="218" r="11" fill="#FFF4D8"/>
      <circle cx="1354" cy="218" r="22" fill="#E8BA67" opacity="0.30"/>
    </g>
    <!-- Far horizon mountain range -->
    <polygon points="0,780 180,640 340,710 560,665 800,740 1050,655 1290,705 1440,610 1600,720 1600,1000 0,1000" fill="#2A465F"/>
    <!-- Left Art Deco Observatory Mesa -->
    <polygon points="0,560 155,520 315,675 430,850 0,880" fill="#1E354A"/>
    <polygon points="155,520 225,585 315,675 180,690" fill="#355A77" opacity="0.65"/>
    <!-- Observatory Dome on Left Ridge -->
    <g transform="translate(155 520)">
      <path d="M-52,0 A52,48 0 0,1 52,0 Z" fill="#E8D8B9"/>
      <path d="M0,-48 A52,48 0 0,1 52,0 L0,0 Z" fill="#C4AD87"/>
      <rect x="-60" y="0" width="120" height="34" fill="#D5C19B"/>
      <rect x="-12" y="-44" width="10" height="44" fill="#1E354A"/>
    </g>
    <!-- Right Faceted Desert Peaks -->
    <polygon points="1160,860 1310,635 1455,515 1600,590 1600,1000 1120,1000" fill="#1B3044"/>
    <polygon points="1455,515 1375,655 1310,635" fill="#B56E42" opacity="0.58"/>
    <!-- Foreground stepped WPA terrace -->
    <path d="M0,845 Q360,790 800,855 T1600,830 L1600,1000 L0,1000 Z" fill="#132333"/>
    
  <!-- Subtle Art Deco poster inner framing lines -->
  <g fill="none" stroke="#F2E7CE" stroke-opacity="0.16" stroke-width="2">
    <rect x="26" y="26" width="1548" height="948" rx="4"/>
    <rect x="36" y="36" width="1528" height="928" rx="2" stroke-opacity="0.09" stroke-width="1"/>
  </g>
  <!-- Subtle matte poster paper texture -->
  <rect width="1600" height="1000" fill="#ffffff" opacity="0.001" filter="url(#paper)"/>
</svg>
