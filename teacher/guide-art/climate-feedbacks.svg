<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D6E5EC"/>
      <stop offset="56%" stop-color="#E8E4D6"/>
      <stop offset="100%" stop-color="#E2BE85"/>
