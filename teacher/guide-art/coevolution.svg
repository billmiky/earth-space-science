<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAE2CC"/>
      <stop offset="56%" stop-color="#E3CFA8"/>
      <stop offset="100%" stop-color="#C99C62"/>
    </linearGradient>
    <filter id="paper" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="a">
        <feFuncA type="linear" slope="0.045"/>
      </feComponentTransfer>
      <feBlend mode="multiply" in2="SourceGraphic"/>
    </filter>
    
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  
    <!-- Golden O2 Art Deco Sunburst -->
    <g fill="#D6983A" opacity="0.22"><polygon points="725.1,314.1 -378.2,374.8 -378.2,245.2 725.1,305.9"/><polygon points="725.7,299.4 -368.2,143.7 -342.9,16.5 727.4,291.3"/><polygon points="729.2,285.1 -313.3,-81.0 -263.7,-200.8 732.4,277.5"/><polygon points="735.4,271.8 -215.7,-290.7 -143.6,-398.5 740.0,265.0"/><polygon points="744.1,260.0 -79.0,-477.3 12.7,-569.0 750.0,254.1"/><polygon points="755.0,250.0 91.5,-633.6 199.3,-705.7 761.8,245.4"/><polygon points="767.5,242.4 289.2,-753.7 409.0,-803.3 775.1,239.2"/><polygon points="781.3,237.4 506.5,-832.9 633.7,-858.2 789.4,235.7"/><polygon points="795.9,235.1 735.2,-868.2 864.8,-868.2 804.1,235.1"/><polygon points="810.6,235.7 966.3,-858.2 1093.5,-832.9 818.7,237.4"/><polygon points="824.9,239.2 1191.0,-803.3 1310.8,-753.7 832.5,242.4"/><polygon points="838.2,245.4 1400.7,-705.7 1508.5,-633.6 845.0,250.0"/><polygon points="850.0,254.1 1587.3,-569.0 1679.0,-477.3 855.9,260.0"/><polygon points="860.0,265.0 1743.6,-398.5 1815.7,-290.7 864.6,271.8"/><polygon points="867.6,277.5 1863.7,-200.8 1913.3,-81.0 870.8,285.1"/><polygon points="872.6,291.3 1942.9,16.5 1968.2,143.7 874.3,299.4"/><polygon points="874.9,305.9 1978.2,245.2 1978.2,374.8 874.9,314.1"/></g>
    <circle cx="800" cy="310" r="88" fill="#E8B858" opacity="0.55"/>
    <circle cx="800" cy="310" r="126" fill="none" stroke="#C97E2E" stroke-width="2" opacity="0.32"/>
    <!-- Rising subtle oxygen bubble rings on left/right -->
    <g fill="none" stroke="#2A6D6B" stroke-opacity="0.24" stroke-width="2">
      <circle cx="290" cy="270" r="24"/><circle cx="330" cy="190" r="14"/><circle cx="255" cy="145" r="9"/>
      <circle cx="1310" cy="285" r="22"/><circle cx="1270" cy="205" r="13"/><circle cx="1340" cy="155" r="8"/>
    </g>
    <!-- Far banded mesa horizon (asymmetric stepped silhouette) -->
    <polygon points="0,590 240,500 510,565 800,605 1090,545 1350,485 1600,565 1600,760 0,760" fill="#B96842" opacity="0.62"/>
    <!-- Left Tall Banded Iron Formation (BIF) Stepped Canyon Cliff -->
    <polygon points="0,290 145,290 215,435 335,495 405,740 0,765" fill="#9A3C24"/>
    <polygon points="0,370 182,370 212,435 0,435" fill="#C97A36"/>
    <polygon points="0,475 305,475 338,525 0,525" fill="#6F2B1D"/>
    <polygon points="0,568 355,568 372,616 0,616" fill="#CC8940"/>
    <polygon points="0,658 384,658 400,704 0,704" fill="#7E3220"/>
    <!-- Right Lower Stepped BIF Headland + Sea Arch -->
    <polygon points="1600,385 1410,385 1335,495 1235,545 1175,740 1600,765" fill="#8C3620"/>
    <polygon points="1600,455 1368,455 1338,495 1600,495" fill="#C67834"/>
    <polygon points="1600,540 1250,540 1228,588 1600,588" fill="#68271A"/>
    <polygon points="1600,630 1208,630 1192,678 1600,678" fill="#C8873E"/>
    <!-- Ancient Turquoise Ocean -->
    <rect x="0" y="720" width="1600" height="280" fill="#2A6D6B"/>
    <g fill="#4E948C" opacity="0.45">
      <rect x="260" y="748" width="1080" height="8" rx="4"/>
      <rect x="380" y="776" width="840" height="6" rx="3"/>
      <rect x="460" y="802" width="680" height="5" rx="2.5"/>
    </g>
    <!-- Foreground Tidal Shelf with Iconic Domed Stromatolites -->
    <path d="M0,840 Q230,805 440,865 T1160,865 Q1380,805 1600,840 L1600,1000 L0,1000 Z" fill="#1F4E4D"/>
    <g>
      <path d="M55,950 C55,865 155,865 155,950 Z" fill="#4E7B42"/>
      <path d="M135,965 C135,895 225,895 225,965 Z" fill="#3D6636"/>
      <path d="M210,975 C210,920 285,920 285,975 Z" fill="#5A894C"/>
      <path d="M72,918 Q105,905 138,918" fill="none" stroke="#9AC27E" stroke-width="4" opacity="0.55"/>
    </g>
    <g>
      <path d="M1440,950 C1440,862 1545,862 1545,950 Z" fill="#4E7B42"/>
      <path d="M1365,965 C1365,895 1455,895 1455,965 Z" fill="#3D6636"/>
      <path d="M1295,975 C1295,922 1370,922 1370,975 Z" fill="#5A894C"/>
      <path d="M1458,916 Q1492,903 1526,916" fill="none" stroke="#9AC27E" stroke-width="4" opacity="0.55"/>
    </g>
    
  <!-- Subtle Art Deco poster inner framing lines -->
  <g fill="none" stroke="#6E3522" stroke-opacity="0.16" stroke-width="2">
    <rect x="26" y="26" width="1548" height="948" rx="4"/>
    <rect x="36" y="36" width="1528" height="928" rx="2" stroke-opacity="0.09" stroke-width="1"/>
  </g>
  <!-- Subtle matte poster paper texture -->
  <rect width="1600" height="1000" fill="#ffffff" opacity="0.001" filter="url(#paper)"/>
</svg>
